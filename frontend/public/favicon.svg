<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Jet Black Background -->
    <linearGradient id="synapse-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d" />
      <stop offset="50%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Cerulean Blue to Red Rim -->
    <linearGradient id="synapse-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007BA7" />
      <stop offset="45%" stop-color="#00a2db" />
      <stop offset="80%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#007BA7" />
    </linearGradient>

    <!-- Cerulean Blue to Red Telemetry Pulse -->
    <linearGradient id="synapse-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007BA7" />
      <stop offset="35%" stop-color="#00a2db" />
      <stop offset="70%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="synapse-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#007BA7" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#EF4444" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="32" cy="32" r="28" fill="url(#synapse-glow)" />

  <!-- Industrial Hexagonal Shield Body -->
  <path
    d="M32 5 L55 18 V46 L32 59 L9 46 V18 Z"
    fill="url(#synapse-bg)"
    stroke="url(#synapse-rim)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Precision Diagnostic Inner Circuit Traces -->
  <path
    d="M32 10 V22 M16 43 L26 35 M48 43 L38 35"
    stroke="#161c24"
    stroke-width="1.75"
    stroke-linecap="round"
  />

  <!-- Synapse Node Connector Lines -->
  <line x1="32" y1="16" x2="32" y2="32" stroke="#007BA7" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75" />
  <line x1="20" y1="45" x2="32" y2="32" stroke="#007BA7" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75" />
  <line x1="44" y1="45" x2="32" y2="32" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75" />

  <!-- Machine Health Diagnostic Telemetry Waveform -->
  <path
    d="M13 32 H22 L26 21 L32 43 L37 24 L42 32 H51"
    stroke="#EF4444"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.35"
    filter="url(#neon-glow)"
  />
  <path
    d="M13 32 H22 L26 21 L32 43 L37 24 L42 32 H51"
    stroke="url(#synapse-pulse)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Synaptic Satellite Nodes -->
  <!-- Top Node (Cerulean Blue) -->
  <circle cx="32" cy="16" r="3.2" fill="#007BA7" filter="url(#neon-glow)" />
  <circle cx="32" cy="16" r="5.5" stroke="#00a2db" stroke-width="1" opacity="0.6" />

  <!-- Bottom Left Node (Cerulean Blue) -->
  <circle cx="20" cy="45" r="2.8" fill="#007BA7" />
  <circle cx="20" cy="45" r="5" stroke="#00a2db" stroke-width="1" opacity="0.5" />

  <!-- Bottom Right Node (Red) -->
  <circle cx="44" cy="45" r="2.8" fill="#EF4444" filter="url(#neon-glow)" />
  <circle cx="44" cy="45" r="5" stroke="#EF4444" stroke-width="1" opacity="0.5" />

  <!-- Center Heartbeat / Spark Core -->
  <circle cx="32" cy="32" r="2.4" fill="#ffffff" filter="url(#neon-glow)" />
</svg>